<!DOCTYPE html>  <html lang="th">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Piggy Bank</title>  <link rel="manifest" href="manifest.json">  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>  <style>  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
font-family:Arial,sans-serif;  
}  
  
body{  
background:#f5f5f5;  
padding:15px;  
}  
  
.container{  
max-width:600px;  
margin:auto;  
}  
  
.card{  
background:white;  
padding:15px;  
border-radius:15px;  
margin-bottom:15px;  
box-shadow:0 2px 10px rgba(0,0,0,.08);  
}  
  
h1{  
text-align:center;  
margin-bottom:15px;  
}  
  
.balance{  
font-size:32px;  
font-weight:bold;  
color:#2e7d32;  
text-align:center;  
}  
  
.goal{  
margin-top:10px;  
font-size:18px;  
text-align:center;  
}  
  
.progress-container{  
height:22px;  
background:#ddd;  
border-radius:30px;  
overflow:hidden;  
margin-top:10px;  
}  
  
.progress-bar{  
height:100%;  
width:0%;  
background:#4CAF50;  
transition:.4s;  
}  
  
.stats{  
display:grid;  
grid-template-columns:1fr 1fr;  
gap:10px;  
margin-top:15px;  
}  
  
.stat-box{  
background:#fafafa;  
padding:10px;  
border-radius:10px;  
text-align:center;  
}  
  
input{  
width:100%;  
padding:12px;  
font-size:16px;  
margin-top:10px;  
border:1px solid #ccc;  
border-radius:10px;  
}  
  
button{  
width:100%;  
padding:12px;  
border:none;  
border-radius:10px;  
margin-top:10px;  
font-size:16px;  
cursor:pointer;  
}  
  
.add{  
background:#4CAF50;  
color:white;  
}  
  
.withdraw{  
background:#f44336;  
color:white;  
}  
  
.delete-btn{  
background:#777;  
color:white;  
padding:5px 8px;  
width:auto;  
}  
  
table{  
width:100%;  
border-collapse:collapse;  
}  
  
th,td{  
padding:8px;  
border-bottom:1px solid #ddd;  
text-align:center;  
}  
  
.badge{  
display:inline-block;  
padding:6px 12px;  
border-radius:20px;  
background:#eee;  
margin:4px;  
}  
  
canvas{  
margin-top:10px;  
}  
  
#calendar{  
display:grid;  
grid-template-columns:repeat(7,1fr);  
gap:5px;  
margin-top:10px;  
}  
  
.day{  
height:32px;  
display:flex;  
justify-content:center;  
align-items:center;  
border-radius:6px;  
background:#eee;  
font-size:12px;  
}  
  
.saved{  
background:#4CAF50;  
color:white;  
}  
  .low-save{  
background:#f44336;  
color:white;  
  }  
</style>  </head>  <body>  <div class="container">  <h1>🐷 Piggy Bank</h1>  <div class="card">  <div class="balance">  
฿ <span id="balance">0</span>  
</div>    <div style="text-align:center;margin-top:10px;">  
<button onclick="toggleHide()">  
🙈 โหมดลืมเงิน  
</button>  
  </div>  <div class="goal">  
🎯 เป้าหมาย 10,000 บาท  
</div>    <div id="progressContainer" class="progress-container">  
  <div id="progressBar" class="progress-bar"></div>  
  </div>  <p style="text-align:center;margin-top:8px;">  
<span id="percent">0</span>% สำเร็จ  
</p>  <p style="text-align:center;">  
เหลืออีก ฿<span id="remaining">10000</span>  
</p>  </div>  <div class="card">  <p id="today"></p>  <input  
type="number"  
id="amount"  
placeholder="จำนวนเงิน">

<button class="add"  
onclick="addMoney()">
➕ เพิ่มเงิน
</button>

<button class="withdraw"  
onclick="withdrawMoney()">
➖ ถอนเงิน
</button>

</div>  <div class="card">  <div class="stats">  <div class="stat-box">  
<p>📅 สัปดาห์นี้</p>  
<h3>฿<span id="weekTotal">0</span></h3>  
</div>  <div class="stat-box">  
<p>📆 เดือนนี้</p>  
<h3>฿<span id="monthTotal">0</span></h3>  
</div>  <div class="stat-box">  
<p>💰 ทั้งหมด</p>  
<h3>฿<span id="allTotal">0</span></h3>  
</div>  <div class="stat-box">  
<p>🎯 เป้าหมาย</p>  
<h3>10,000</h3>  
</div>  </div>  </div>  <div class="card">  <h3>🏆 Achievement</h3>  <div id="badges">  
<span class="badge">25%</span>  
<span class="badge">50%</span>  
<span class="badge">75%</span>  
<span class="badge">100%</span>  
</div>  </div>  <div class="card">  <h3>📈 กราฟการออม</h3>  <canvas id="chart"></canvas>

</div>  <div class="card">  <h3>📅 ปฏิทินการออม</h3>  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">  
<button onclick="changeMonth(-1)" style="width:auto;">◀</button>  <span id="calendarTitle"></span>

<button onclick="changeMonth(1)" style="width:auto;">▶</button>

</div>  <div id="calendar"></div>  </div>  <div class="card">  <div class="card">  <h3>📊 สถิติรายเดือน</h3>  <div id="monthlyStats"></div>  </div>  
<h3>📝 ประวัติรายการ</h3>  <table>  <thead>  
<tr>  
<th>วันที่</th>  
<th>รายการ</th>  
<th>จำนวน</th>  
<th></th>  
</tr>  
</thead>  <tbody id="history"></tbody>  </table>  </div>  </div>  <script>  
  
const GOAL = 10000;  
  
let records =  
JSON.parse(  
localStorage.getItem("piggyRecords")  
) || [];  
    
  let currentMonth = new Date().getMonth();  
let currentYear = new Date().getFullYear();  
  
document.getElementById("today")  
.innerText =  
"วันนี้ : " +  
new Date()  
.toLocaleDateString("th-TH");  
  
function saveData(){  
localStorage.setItem(  
"piggyRecords",  
JSON.stringify(records)  
);  
}  
  
function addMoney(){  
  
let amount =  
Number(  
document.getElementById("amount").value  
);  
  
if(amount<=0){  
alert("กรอกจำนวนเงิน");  
return;  
}  
  
records.push({  
type:"เพิ่ม",  
amount:amount,  
date:new Date().toISOString()  
});  
  
saveData();  
render();  
  
document.getElementById("amount").value="";  
}  
  
function withdrawMoney(){  
  
let amount =  
Number(  
document.getElementById("amount").value  
);  
  
if(amount<=0){  
alert("กรอกจำนวนเงิน");  
return;  
}  
  
records.push({  
type:"ถอน",  
amount:-amount,  
date:new Date().toISOString()  
});  
  
saveData();  
render();  
  
document.getElementById("amount").value="";  
}  
  function deleteRecord(index){  
records.splice(index,1);  
saveData();  
render();  
}  
  
let chart;  
  
function render(){  
  
let balance = 0;  
let weekTotal = 0;  
let monthTotal = 0;  
  
const now = new Date();  
  
const history =  
document.getElementById("history");  
  
history.innerHTML = "";  
  
records.forEach((item,index)=>{  
  
balance += item.amount;  
  
  let d = new Date(item.date);  
  
let diff =  
(now-d)/(1000*60*60*24);  
  
if(diff <= 7){  
weekTotal += item.amount;  
}  
  
if(  
d.getMonth()===now.getMonth()  
&&  
d.getFullYear()===now.getFullYear()  
){  
monthTotal += item.amount;  
}  
  
history.innerHTML += `  
<tr>  
<td>${d.toLocaleDateString("th-TH")}</td>  
<td>${item.type}</td>  
<td>฿${item.amount}</td>  
<td>  
<button  
class="delete-btn"  
onclick="deleteRecord(${index})">  
ลบ  
</button>  
</td>  
</tr>  
`;  
  
});  
  
  let percent =  
  Math.min(  
  100,  
  ((balance/GOAL)*100).toFixed(1)  
  );  
  
  if(hiddenMode){  
  
  document.getElementById("balance").innerText = "••••••";  
  document.getElementById("percent").innerText = "•••";  
  document.getElementById("weekTotal").innerText = "•••";  
  document.getElementById("monthTotal").innerText = "•••";  
  document.getElementById("allTotal").innerText = "••••••";  
  document.getElementById("remaining").innerText = "••••••";  
  
  }else{  
  
  document.getElementById("balance")  
  .innerText =  
  balance.toLocaleString();  
  
  document.getElementById("weekTotal")  
  .innerText =  
  weekTotal.toLocaleString();  
  
  document.getElementById("monthTotal")  
  .innerText =  
  monthTotal.toLocaleString();  
  
  document.getElementById("allTotal")  
  .innerText =  
  balance.toLocaleString();  
  
  document.getElementById("percent")  
  .innerText = percent;  
  
  document.getElementById("remaining")  
  .innerText =  
  Math.max(  
  0,  
  GOAL-balance  
  ).toLocaleString();  
  
  }  
  
  if(hiddenMode){  
  
  document  
  .getElementById("progressContainer")  
  .style.display = "none";  
  
  }else{  
  
  document  
  .getElementById("progressContainer")  
  .style.display = "block";  
  
  document  
  .getElementById("progressBar")  
  .style.width =  
  percent + "%";  
  
  }  
  
achievement(percent);  
  
  drawCalendar();  
  
  drawChart();  
  
  drawMonthlyStats();  
  
}  
  
function achievement(percent){  
  
if(percent >= 100){  
alert("👑 ยินดีด้วย! ถึงเป้าหมายแล้ว");  
}  
else if(percent >= 75){  
console.log("🥇 75%");  
}  
else if(percent >= 50){  
console.log("🥈 50%");  
}  
else if(percent >= 25){  
console.log("🥉 25%");  
}  
  
}  
  
  function drawCalendar(){  
  
  const calendar =  
  document.getElementById("calendar");  
  
  calendar.innerHTML = "";  
  
  const monthNames = [  
  "ม.ค.","ก.พ.","มี.ค.","เม.ย.",  
  "พ.ค.","มิ.ย.","ก.ค.","ส.ค.",  
  "ก.ย.","ต.ค.","พ.ย.","ธ.ค."  
  ];  
  
  document.getElementById("calendarTitle")  
  .innerText =  
  monthNames[currentMonth] +  
  " " +  
  (currentYear + 543);  
  
  const dayTotals = {};  
  
  records.forEach(r=>{  
  
  const d = new Date(r.date);  
  
  if(  
  d.getMonth() === currentMonth &&  
  d.getFullYear() === currentYear  
  ){  
  
  const day = d.getDate();  
  
  if(!dayTotals[day]){  
  dayTotals[day] = 0;  
  }  
  
  dayTotals[day] += r.amount;  
  
  }  
  
  });  
  
  const daysInMonth =  
  new Date(  
  currentYear,  
  currentMonth + 1,  
  0  
  ).getDate();  
  
  for(let i=1;i<=daysInMonth;i++){  
  
  const div =  
  document.createElement("div");  
  
  div.className = "day";  
  
  if(dayTotals[i] >= 60){  
  
  div.classList.add("saved");  
  
  }else if(dayTotals[i] > 0){  
  
  div.classList.add("low-save");  
  
  }  
  
  div.innerText = i;  
  
  calendar.appendChild(div);  
  
  }  
  
  }  
    
  function changeMonth(step){  
  
currentMonth += step;  
  
if(currentMonth < 0){  
currentMonth = 11;  
currentYear--;  
}  
  
if(currentMonth > 11){  
currentMonth = 0;  
currentYear++;  
}  
  
    drawCalendar();  
    drawChart();  
  
  }  
  
function drawChart(){  
  
const daily = {};  
  
let running = 0;  
  
  records  
  .filter(r=>{  
  
  const d = new Date(r.date);  
  
  return (  
  d.getMonth() === currentMonth &&  
  d.getFullYear() === currentYear  
  );  
  
  })  
  .sort((a,b)=>  
  new Date(a.date)  
  -  
  new Date(b.date)  
  )  
  .forEach(r=>{  
  
running += r.amount;  
  
let day =  
new Date(r.date)  
.toLocaleDateString(  
"th-TH"  
);  
  
daily[day] = running;  
  
});  
  
const labels =  
Object.keys(daily);  
  
const values =  
Object.values(daily);  
  
const ctx =  
document  
.getElementById("chart");  
  
if(chart){  
chart.destroy();  
}  
    
  
chart =  
new Chart(ctx,{  
type:"line",  
data:{  
labels:labels,  
datasets:[{  
label:"เงินสะสม",  
data:values,  
fill:true,  
tension:.3  
}]  
},  
options:{  
responsive:true  
}  
});  
  
}  
  
  
let hiddenMode = true;  
function drawMonthlyStats(){  
  
const stats = {};  
  
records.forEach(r=>{  
  
const d = new Date(r.date);  
  
const key =  
d.toLocaleDateString(  
"th-TH",  
{  
month:"short",  
year:"numeric"  
}  
);  
  
if(!stats[key]){  
stats[key] = 0;  
}  
  
stats[key] += r.amount;  
  
});  
  
const box =  
document.getElementById(  
"monthlyStats"  
);  
  
box.innerHTML = "";  
  
Object.entries(stats)  
.reverse()  
.forEach(([month,total])=>{  
  
box.innerHTML += `  
<p style="  
padding:8px;  
border-bottom:1px solid #ddd;  
display:flex;  
justify-content:space-between;  
">  
<span>${month}</span>  
<b>฿${total.toLocaleString()}</b>  
</p>  
`;  
  
});  
  
}  
function toggleHide(){  
  
hiddenMode = !hiddenMode;  
  
if(hiddenMode){  
  
document.getElementById("balance").innerText = "••••••";  
document.getElementById("percent").innerText = "•••";  
    
document.getElementById("weekTotal").innerText = "•••";  
document.getElementById("monthTotal").innerText = "•••";  
document.getElementById("allTotal").innerText = "••••••"; document.getElementById("remaining").innerText = "••••••";  
}else{  
    
    
  
render();  
  
}  
  
  }  
render();  
  
</script>  </body>  
</html>
